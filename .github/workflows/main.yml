
name: Build SnapLock APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: unzip SnapLockAndroid_source.zip -d project

      - name: Fix Java and Kotlin targets
        working-directory: project/SnapLockAndroid
        run: |
          find . -name "*.gradle" -o -name "*.gradle.kts" | xargs sed -i 's/JVM_1_8/JVM_17/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g'

      - name: Build APK
        working-directory: project/SnapLockAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapLock-APK
          path: project/SnapLockAndroid/app/build/outputs/apk/debug/app-debug.apk
